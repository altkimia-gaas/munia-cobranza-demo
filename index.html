<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MunIA Cobranza — MVP demostrable</title>
<!--
  ============================================================================
  MunIA Cobranza — MVP demostrable (single-file, sin backend)
  ALTKimia SpA · Municipalidad ficticia de Villa Esperanza
  ----------------------------------------------------------------------------
  COMPLETO: 13 módulos — Inducción · M1 brecha · M3 cartera · M4 prescripción ·
  M5 ficha · M6 informe · M2 carga · M7 comunicaciones · M8 convenio ·
  M9 transparencia · M10 levantamiento · M11 guion · Ayuda.
  Branding: munia.cl (violeta #4F46E5, Inter + DM Mono, logo cívico).
  ----------------------------------------------------------------------------
  RESTRICCIÓN FUNDACIONAL: todos los datos son SINTÉTICOS. La banda ámbar
  superior es fija y no descartable en el 100% de las vistas.
  Todo el código está comentado en español.
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   VARIABLES DE IDENTIDAD VISUAL
   - Shell/navegación oscuros; área de trabajo clara (el funcionario trabaja
     horas en esta pantalla).
   - Azul de acento máximo ~20% de la composición.
   - Semáforo (verde/ámbar/rojo/negro) EXCLUSIVO para estado de prescripción.
   =========================================================================== */
:root{
  /* Marca MunIA (munia.cl): violeta sobre shell oscuro + área de trabajo clara */
  --abyss:#080B12; --night:#0D1117; --panel:#111827; --panel-2:#161F30;
  --border:#1E2D4A; --border-soft:#26364F;
  --work:#FFFFFF; --work-alt:#F7F8FC; --work-line:#D1D9E6;
  --ink:#0A0E1A; --ink-soft:#4B5563; --ink-mute:#647186;   /* ≥4.5:1 sobre blanco y F7F8FC (WCAG AA) */
  --blue:#4F46E5; --blue-dark:#4338CA; --blue-light:#818CF8; --blue-soft:#EEF2FF;
  --green:#10B981; --amber:#F59E0B; --red:#EF4444; --black-chip:#0A0E1A;
  --amber-band:#F59E0B;
  --civic-grad:linear-gradient(135deg,#002449 0%,#632ce5 100%);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --title:'Inter',var(--sans);
  --mono:'DM Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--abyss);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:rgba(79,70,229,.28)}
/* Foco visible para navegación con teclado (WCAG 2.4.7) */
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
#nav :focus-visible,.fab:focus-visible,#guion-panel :focus-visible{outline-color:var(--blue-light)}

/* ---- Banda de datos de demostración: fija, no descartable ---- */
#banda-demo{
  position:fixed;top:0;left:0;right:0;height:26px;z-index:1000;
  background:var(--amber-band);color:#3A2A00;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.2px;
  border-bottom:1px solid #C77E00;padding:0 12px;text-align:center;
}
#banda-demo svg{flex:none}

/* ---- Layout general ---- */
#app{position:fixed;top:26px;left:0;right:0;bottom:0;display:flex;background:var(--night)}
#nav{width:236px;flex:none;background:var(--abyss);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;
  background-image:linear-gradient(rgba(129,140,248,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,.05) 1px,transparent 1px);background-size:28px 28px}
#main{flex:1;background:var(--work-alt);overflow-y:auto;position:relative}

/* ---- Marca ---- */
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--civic-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 1px rgba(129,140,248,.25) inset}
.brand-mark svg{width:19px;height:19px}
.brand h1{font-family:var(--title);font-size:18px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1}
.brand h1 span{color:var(--blue-light)}
.brand p{font-size:9px;color:#8492A5;margin-top:3px;font-family:var(--mono);letter-spacing:1.4px;text-transform:uppercase}

/* ---- Navegación ---- */
.nav-group{padding:10px 10px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8492A5;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:1px 8px;border-radius:7px;color:#AEB9C7;cursor:pointer;font-size:13px;font-weight:500;user-select:none;border:1px solid transparent}
.nav-item:hover{background:var(--panel);color:#E4EAF1}
.nav-item.active{background:rgba(79,70,229,.14);color:#fff;border-color:rgba(129,140,248,.30)}
.nav-item.active .ico{color:var(--blue-light)}
.nav-item .ico{width:17px;height:17px;flex:none;color:currentColor}
.nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:10px;background:rgba(79,70,229,.18);color:var(--blue-light);border:1px solid rgba(129,140,248,.30)}
.nav-item.soon{opacity:.5}
.nav-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);font-size:10.5px;color:#8492A5;font-family:var(--mono)}

/* ---- Toggle levantamiento (placeholder visual, M10 en checkpoint futuro) ---- */
.lev-toggle{display:flex;align-items:center;gap:8px;margin:8px 12px;padding:8px 12px;border:1px solid var(--border-soft);border-radius:8px;color:#8492A5;font-size:12px}
.lev-toggle .dot{width:8px;height:8px;border-radius:50%;background:#3A4658}

/* ---- Área de trabajo ---- */
.view{padding:22px 26px 60px;max-width:1240px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.view-title{font-family:var(--title);font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.6px}
.view-sub{color:var(--ink-soft);font-size:13px;margin-top:3px;max-width:640px}
.eyebrow{font-family:var(--mono);font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}

/* ---- Tarjetas de brecha (M1) ---- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.card{background:var(--work);border:1px solid var(--work-line);border-radius:12px;padding:18px;display:flex;flex-direction:column;min-height:168px}
.card .k-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(79,70,229,.10);color:var(--blue-dark);margin-bottom:12px}
.card .k-ico svg{width:18px;height:18px}
.card .k-num{font-family:var(--mono);font-size:38px;font-weight:500;line-height:1;color:var(--ink);letter-spacing:-1px}
.card .k-lbl{font-size:13px;font-weight:600;color:var(--ink);margin-top:8px}
.card .k-norm{font-size:11px;color:var(--ink-mute);margin-top:6px;line-height:1.35;flex:1}
.card .k-cta{margin-top:12px;align-self:flex-start;font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);border:1px solid #C7CCF7;border-radius:7px;padding:6px 11px;cursor:pointer;font-family:var(--sans)}
.card .k-cta:hover{background:#E0E3FB}
.card.accent-num .k-num{color:var(--amber)}
.card.accent-red .k-num{color:var(--red)}

/* ---- Bloque de procedencia ---- */
.origin{background:var(--work);border:1px solid var(--work-line);border-radius:12px;padding:16px 18px;margin-bottom:8px}
.origin h3{font-family:var(--title);font-size:14px;margin-bottom:10px;color:var(--ink)}
.origin .rows{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
.origin .r{display:flex;gap:9px;font-size:12px;color:var(--ink-soft);align-items:flex-start}
.origin .r b{color:var(--ink);font-weight:600}
.origin .r .src{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
.origin .r i{color:var(--blue);flex:none;margin-top:1px}

/* ---- Tabla genérica ---- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-mute);font-weight:600}
select,input[type=text],input[type=number],textarea{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--work);border:1px solid var(--work-line);border-radius:8px;padding:7px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--blue)}
.btn{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:8px;padding:8px 13px;cursor:pointer;border:1px solid transparent;background:var(--work);color:var(--ink);border-color:var(--work-line)}
.btn:hover{background:var(--work-alt)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-blue:hover{background:#4338CA}
.btn-ghost{background:transparent;border-color:var(--work-line)}
.count-pill{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

/* Tamaño de íconos SVG en contenedores sin clase de tamaño (evita SVG gigantes) */
.origin .r svg{width:17px;height:17px;flex:none;color:var(--blue);stroke-width:2}
.tl2 .col-head svg{width:18px;height:18px;flex:none;color:var(--blue)}
.soon-panel .sp-ico svg{width:38px;height:38px}
.drop .d-ico svg{width:36px;height:36px}

.table-wrap{background:var(--work);border:1px solid var(--work-line);border-radius:12px;overflow:hidden}
.tbl-scroll{max-height:calc(100vh - 320px);overflow:auto}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--work);z-index:2;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--work-line);white-space:nowrap;cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
thead th .arrow{color:var(--blue)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--work-alt);font-size:12.5px;color:var(--ink);white-space:nowrap}
tbody tr:hover{background:var(--work-alt)}
/* Affordance: en la cartera, la fila es clickeable (abre la ficha) */
#m3-table tbody tr:hover td:nth-child(2){color:var(--blue-dark);text-decoration:underline}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);text-align:right}
.muted{color:var(--ink-mute)}

/* ---- Semáforo de prescripción (uso EXCLUSIVO) ---- */
.sem{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:500}
.sem .d{width:9px;height:9px;border-radius:50%;flex:none}
.sem.verde .d{background:var(--green)} .sem.verde{color:#0A7C5A}
.sem.ambar .d{background:var(--amber)} .sem.ambar{color:#8A5C00}
.sem.rojo .d{background:var(--red)} .sem.rojo{color:#B4232C}
.sem.negro .d{background:var(--black-chip)} .sem.negro{color:var(--black-chip)}
.sem.na .d{background:var(--work-line)} .sem.na{color:var(--ink-mute)}

/* ---- Chips de estado ---- */
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid;font-family:var(--sans)}
.chip.pagada{color:#0A7C5A;background:#E7F7F0;border-color:#BEEAD8}
.chip.impaga{color:#8A5C00;background:#FDF4E3;border-color:#F4E0B4}
.chip.convenida{color:#4338CA;background:var(--blue-soft);border-color:#C7CCF7}
.chip.prescrita{color:#fff;background:var(--black-chip);border-color:var(--black-chip)}
.chip.en_juicio{color:#6D28D9;background:#F1EBFB;border-color:#DDCEF6}
.chip.incobrable{color:#57606E;background:#EEF1F5;border-color:#DCE2EA}
.gate{display:inline-block;font-size:10px;font-family:var(--mono);color:var(--ink-soft);background:var(--work-alt);border:1px solid var(--work-line);border-radius:5px;padding:1px 6px;margin-right:3px}

/* ---- M4: cortes / línea de tiempo / simulador ---- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{background:var(--work);border:1px solid var(--work-line);border-radius:12px;padding:18px}
.box h3{font-family:var(--title);font-size:15px;margin-bottom:4px;color:var(--ink)}
.box .h-sub{font-size:12px;color:var(--ink-mute);margin-bottom:14px}
.cut{display:flex;align-items:baseline;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--work-alt)}
.cut:last-child{border-bottom:0}
.cut .c-lbl{font-size:13px;font-weight:600}
.cut .c-desc{font-size:11px;color:var(--ink-mute)}
.cut .c-num{font-family:var(--mono);font-size:24px;font-weight:500}
.legal-box{border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:0 10px 10px 0;padding:14px 16px;font-size:12.5px;color:#312E81;line-height:1.5}
.legal-box b{color:#1E1B4B}
.legal-box ol{margin:8px 0 8px 18px}
.legal-box .warn{color:#B4232C;font-weight:600;margin-top:8px;display:block}
.legal-box .cite{font-family:var(--mono);font-size:11px;color:#4F46E5;display:block;margin-top:8px}

/* Línea de tiempo por cuota */
.timeline{margin-top:6px}
.tl-track{position:relative;height:54px;margin:34px 6px 6px}
.tl-line{position:absolute;top:26px;left:0;right:0;height:3px;background:var(--work-line);border-radius:2px}
.tl-fill{position:absolute;top:26px;left:0;height:3px;border-radius:2px}
.tl-node{position:absolute;top:18px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);border:3px solid var(--work);box-shadow:0 0 0 1px var(--work-line)}
.tl-lbl{position:absolute;top:-4px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);white-space:nowrap}
.tl-date{position:absolute;top:38px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--ink-mute);white-space:nowrap}

.sim-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.reloj{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.5px}
.pulse{animation:pulse 1.4s ease-in-out 2}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%{background:#FEF6E7}100%{background:var(--work)}}
.counter-strip{display:flex;gap:26px;flex-wrap:wrap;background:var(--night);border-radius:12px;padding:16px 20px;color:#fff;margin-top:16px}
.counter-strip .cs{display:flex;flex-direction:column}
.counter-strip .cs .n{font-family:var(--mono);font-size:26px;color:var(--blue-light)}
.counter-strip .cs .l{font-size:11px;color:#93A2B5}

/* ---- Modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(6,9,15,.55);z-index:2000;display:none;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--work);border-radius:14px;max-width:900px;width:100%;border:1px solid var(--work-line)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--work-line)}
.modal-head h3{font-family:var(--title);font-size:16px}
.modal-body{padding:6px 20px 20px}
.x{cursor:pointer;color:var(--ink-mute);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.x:hover{background:var(--work-alt);color:var(--ink)}

/* ---- Panel "próximo checkpoint" ---- */
.soon-panel{background:var(--work);border:1px dashed var(--work-line);border-radius:12px;padding:40px;text-align:center;color:var(--ink-mute)}
.soon-panel .sp-ico{width:40px;height:40px;margin:0 auto 12px;color:var(--ink-mute)}
.soon-panel h3{font-family:var(--title);font-size:17px;color:var(--ink-soft);margin-bottom:6px}

.note{font-size:11px;color:var(--ink-mute);font-family:var(--mono)}
.sim-tag{display:inline-block;font-family:var(--mono);font-size:10px;color:#8A5C00;background:#FDF4E3;border:1px solid #F4E0B4;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* ---- M5 · Ficha: identificación y contraste de domicilios ---- */
.id-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
.dom-contrast{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dom{border:1px solid var(--work-line);border-radius:10px;padding:12px 14px}
.dom .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-mute);font-weight:600;margin-bottom:4px}
.dom .v{font-family:var(--mono);font-size:13px;color:var(--ink)}
.dom.diff{border-color:#F4E0B4;background:#FFFCF5}
.dom.diff .v{color:#8A5C00}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--work-alt);font-size:13px}
.kv:last-child{border-bottom:0}.kv .kk{color:var(--ink-mute)}.kv .vv{font-family:var(--mono);color:var(--ink);text-align:right}

/* Dos líneas de tiempo PARALELAS y visualmente distintas (Actos vs Avisos) */
.tl2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.tl2 .col-head{display:flex;align-items:center;gap:8px;font-family:var(--title);font-size:14px;margin-bottom:4px}
.tl2 .col-head .tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px}
.col-actos .col-head .tag{background:#EEF2FF;color:#4338CA;border:1px solid #C7CCF7}
.col-avisos .col-head .tag{background:#EEF1F5;color:#57606E;border:1px solid #DCE2EA}
.evt{position:relative;margin:10px 0 0 6px;padding:10px 12px 10px 16px;font-size:12.5px}
.evt-actos{border-left:3px solid var(--blue);background:#FBFDFF;border-radius:0 8px 8px 0}
.evt-avisos{border-left:3px dashed #9AA6B4;background:#FAFBFC;border-radius:0 8px 8px 0;color:var(--ink-soft)}
.evt .e-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.evt .e-tipo{font-weight:600;color:var(--ink);text-transform:capitalize;display:flex;align-items:center;gap:6px}
.evt-avisos .e-tipo{color:var(--ink-soft);font-weight:600}
.evt .e-fecha{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
.evt .e-meta{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-top:3px}
.leyenda{background:var(--night);color:#C7D2DF;border-radius:10px;padding:12px 16px;font-size:12.5px;margin:14px 0 4px;line-height:1.5}
.leyenda b{color:#fff}

/* ---- M6 · Informe de antecedentes (documento) ---- */
.doc{background:var(--work);border:1px solid var(--work-line);border-radius:12px;padding:30px 34px;max-width:820px}
.doc h2{font-family:var(--title);font-size:19px;margin-bottom:2px}
.doc .doc-sub{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-bottom:18px}
.doc-demo{font-family:var(--mono);font-size:11px;color:#8A5C00;background:#FDF4E3;border:1px solid #F4E0B4;border-radius:6px;padding:6px 10px;margin-bottom:16px;display:inline-block}
.doc section{margin:16px 0;padding-top:14px;border-top:1px solid var(--work-line)}
.doc .s-num{font-family:var(--mono);font-size:11px;color:var(--blue);font-weight:500}
.doc .s-tit{font-family:var(--title);font-size:14px;margin:2px 0 8px}
.doc .fuente{font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding:4px 0;display:flex;gap:8px}
.doc .fuente b{color:var(--ink)}
.doc .no-verif{background:#FFF7F7;border:1px solid #F6D5D5;border-radius:8px;padding:10px 12px}
.doc .no-verif li{margin-left:16px}
.sign-box{background:var(--work-alt);border:1px solid var(--work-line);border-radius:10px;padding:16px}
.sign-box textarea{width:100%;min-height:76px;resize:vertical}
.charc{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-top:4px}
.charc.ok{color:#0A7C5A}
.legal-nota{border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:0 8px 8px 0;padding:12px 14px;font-size:12px;color:#312E81;margin-top:14px}
.firmado-sello{border:2px solid var(--green);color:#0A7C5A;border-radius:10px;padding:12px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.6}

/* ---- M2 · Carga y conciliación ---- */
.drop{border:2px dashed var(--work-line);border-radius:12px;padding:22px 18px;text-align:center;color:var(--ink-mute);background:var(--work);cursor:pointer;height:100%}
.drop.hover{border-color:var(--blue);background:var(--blue-soft)}
.drop .d-ico{width:30px;height:30px;margin:0 auto 8px;color:var(--ink-mute)}
.drop.cargado{border-style:solid;border-color:#BEEAD8;background:#FBFEFC;color:var(--ink-soft)}
.paso-lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--blue-dark);margin-bottom:6px;font-weight:500}
.padron-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:14px;border:1px solid}
.padron-chip.demo{color:#8A5C00;background:#FDF4E3;border-color:#F4E0B4}
.padron-chip.real{color:#0A7C5A;background:#E7F7F0;border-color:#BEEAD8}
.recon-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.recon-card{border:1px solid var(--work-line);border-radius:10px;padding:14px 16px;background:var(--work)}
.recon-card .rc-n{font-family:var(--mono);font-size:28px;font-weight:500}
.recon-card .rc-l{font-size:12px;color:var(--ink-soft);margin-top:2px}
/* Colores NO semáforo (azul/gris/oscuro): el verde/ámbar/rojo queda reservado
   a la prescripción. La conciliación es otro eje y no debe confundirse. */
.recon-card.exacta{border-left:3px solid var(--blue)} .recon-card.exacta .rc-n{color:var(--ink)}
.recon-card.difusa{border-left:3px solid var(--border-soft)} .recon-card.difusa .rc-n{color:var(--ink)}
.recon-card.sin{border-left:3px solid var(--night);background:#F4F7FB} .recon-card.sin .rc-n{color:var(--ink)}
.mtag{font-size:10.5px;font-family:var(--mono);padding:1px 6px;border-radius:5px;border:1px solid}
.mtag.exacta{color:#4338CA;background:var(--blue-soft);border-color:#C7CCF7}
.mtag.difusa{color:#57606E;background:#EEF1F5;border-color:#DCE2EA}
.mtag.sin{color:#fff;background:var(--night);border-color:var(--night)}

/* ---- M7 · Comunicaciones ---- */
.hitos{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.hito{flex:1 0 150px;border:1px solid var(--work-line);border-radius:10px;padding:12px 14px;background:var(--work)}
.hito .h-t{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--ink)}
.hito .h-ev{font-size:12px;color:var(--ink);margin:4px 0 2px;font-weight:600}
.hito .h-canal{font-size:11px;color:var(--ink-mute);font-family:var(--mono)}
.hito .h-efecto{margin-top:8px;font-size:10.5px;font-family:var(--mono);padding:1px 7px;border-radius:20px;display:inline-block;border:1px solid}
.hito .h-efecto.si{color:#4338CA;background:var(--blue-soft);border-color:#C7CCF7}
.hito .h-efecto.no{color:#57606E;background:#EEF1F5;border-color:#DCE2EA}
.phone{border:2px solid var(--night);border-radius:26px;padding:14px 12px 18px;max-width:290px;background:#0D1117}
.phone .p-top{height:18px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.phone .p-top .notch{width:80px;height:6px;border-radius:6px;background:#2A3340}
.phone .p-app{background:#0B141A;border-radius:12px;overflow:hidden;border:1px solid #202B36}
.phone .p-head{background:#1F2C33;color:#E6EDF2;padding:8px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px}
.phone .p-head .av{width:22px;height:22px;border-radius:50%;background:#2E7D5B;flex:none}
.phone .p-body{padding:14px 10px;min-height:120px;background:#0B141A}
.bubble{background:#144D37;color:#E6F4EC;border-radius:10px 10px 10px 2px;padding:9px 11px;font-size:12.5px;line-height:1.45;max-width:92%}
.bubble .t{font-size:9.5px;color:#9FC7B3;text-align:right;margin-top:4px}
.reasons li{margin:8px 0;padding-left:2px;font-size:12.5px;line-height:1.5}
.reasons li b{color:var(--ink)}
.validador-out{border:1px solid var(--work-line);border-radius:8px;padding:12px;min-height:56px;font-size:13px;line-height:1.7;background:var(--work-alt)}
.bad{background:#FDECEC;color:#B4232C;border-bottom:2px solid #EF4444;border-radius:3px;padding:0 3px;font-weight:600}
.finding{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:6px 0;border-bottom:1px solid var(--work-alt)}
.finding .term{font-family:var(--mono);color:#B4232C;font-weight:600;flex:none;min-width:88px}
.ok-msg{color:#0A7C5A;font-size:12.5px;font-family:var(--mono)}

/* ---- M8 · Convenio ---- */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.plan-out{background:var(--night);color:#fff;border-radius:12px;padding:16px 20px;display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.plan-out .po{display:flex;flex-direction:column}
.plan-out .po .n{font-family:var(--mono);font-size:24px;color:var(--blue-light)}
.plan-out .po .l{font-size:11px;color:#93A2B5}

/* ---- M9 · Transparencia ---- */
.transp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.transp-col{border:1px solid var(--work-line);border-radius:10px;padding:14px 16px;background:var(--work)}
.transp-col h4{font-family:var(--title);font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.transp-col ul{margin-left:16px}
.transp-col li{font-size:12.5px;margin:5px 0}
.dot-ai{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}
.dot-hum{width:8px;height:8px;border-radius:2px;background:var(--ink-soft);display:inline-block}
.licitud{border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:0 10px 10px 0;padding:14px 16px;font-size:13px;color:#312E81;margin-bottom:16px;line-height:1.55}
.bitacora{max-height:280px;overflow:auto}
.bit-row{display:flex;gap:12px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--work-alt);align-items:baseline}
.bit-row .bt{font-family:var(--mono);font-size:11px;color:var(--ink-mute);flex:none;min-width:120px}

/* ---- M10 · Modo levantamiento ---- */
.lev-toggle{cursor:pointer}
.lev-toggle.on{border-color:#1E5A44;background:#0E1E18;color:#7BD4AC}
.lev-toggle.on .dot{background:var(--green)}
.fab{position:fixed;right:18px;z-index:1500;font-family:var(--sans);font-size:13px;font-weight:600;border-radius:24px;padding:11px 18px;cursor:pointer;border:1px solid var(--border-soft);color:#fff;background:var(--night);display:flex;align-items:center;gap:8px}
.fab:hover{background:var(--panel-2)}
#guion-fab{bottom:18px}
#lev-fab{bottom:70px;background:var(--green);border-color:var(--green);color:#04150E;display:none}
.lev-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.lev-card{border:1px solid var(--work-line);border-radius:10px;padding:14px 16px;background:var(--work)}
.lev-card .n{font-family:var(--mono);font-size:26px;color:var(--ink)}
.lev-card .l{font-size:12px;color:var(--ink-soft);margin-top:2px}
.prio{font-size:10.5px;font-family:var(--mono);padding:1px 7px;border-radius:20px;border:1px solid}
.prio.Crítico{color:#B4232C;background:#FDECEC;border-color:#F6D5D5}
.prio.Importante{color:#4338CA;background:var(--blue-soft);border-color:#C7CCF7}
.prio.Deseable{color:#57606E;background:#EEF1F5;border-color:#DCE2EA}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-family:var(--sans);font-size:12.5px;padding:7px 13px;border-radius:8px;border:1px solid var(--work-line);background:var(--work);cursor:pointer;color:var(--ink)}
.seg button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ---- M11 · Guion (panel del presentador) ---- */
#guion-panel{position:fixed;top:26px;right:0;bottom:0;width:390px;max-width:88vw;transform:translateX(100%);transition:transform .25s ease;z-index:1400;background:var(--night);color:#E4EAF1;overflow-y:auto;border-left:1px solid var(--border);padding:18px 18px 40px}
#guion-panel.open{transform:translateX(0)}
#guion-panel h3{font-family:var(--title);color:#fff;font-size:16px;margin-bottom:2px}
#guion-panel .gp-sub{font-size:11px;color:#8492A5;font-family:var(--mono);margin-bottom:14px}
.gstep{border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.gstep .g-min{font-family:var(--mono);font-size:12px;color:var(--blue-light);font-weight:500}
.gstep .g-mod{font-family:var(--mono);font-size:11px;color:#8492A5;float:right}
.gstep .g-mostrar{font-weight:600;color:#fff;margin:4px 0}
.gstep .g-decir{font-size:12.5px;color:#C7D2DF;line-height:1.45}

.gstep.cierre{border-color:#3A5A2E;background:#12200E}
.gstep.cierre .g-preg{color:#A6E27F;font-weight:600;font-style:normal}
.kbd{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:4px;padding:1px 6px;color:#AEB9C7}

/* ---- Inducción ---- */
.ind-hero{background:var(--night);color:#E4EAF1;border-radius:14px;padding:22px 24px;margin-bottom:18px;background-image:linear-gradient(rgba(129,140,248,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,.06) 1px,transparent 1px);background-size:26px 26px}
.ind-hero h2{font-family:var(--title);font-size:20px;font-weight:800;letter-spacing:-.5px;color:#fff;margin-bottom:6px}
.ind-hero p{font-size:13px;color:#AEB9C7;max-width:660px;line-height:1.55}
.ind-prog{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
.ind-prog .bar{flex:1;height:8px;border-radius:6px;background:var(--work-line);overflow:hidden}
.ind-prog .bar i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .3s}
.ind-prog .lbl{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}

.ind-step.done{border-color:#BEEAD8;background:#FBFEFC}
.ind-num{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:500;background:rgba(79,70,229,.10);color:var(--blue-dark)}
.ind-step.done .ind-num{background:var(--green);color:#fff}
.ind-step .st-body{flex:1}
.ind-step .st-t{font-weight:600;font-size:14px}
.ind-step .st-d{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
.ind-step .st-actions{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.chk{font-size:12px;font-family:var(--sans);border:1px solid var(--work-line);border-radius:7px;padding:6px 11px;cursor:pointer;background:var(--work);color:var(--ink-soft)}
.chk.on{background:#E7F7F0;border-color:#BEEAD8;color:#0A7C5A}
.concept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.concept{border:1px solid var(--work-line);border-radius:12px;padding:16px;background:var(--work)}
.concept h4{font-family:var(--title);font-size:13.5px;margin-bottom:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.concept .c-tag{font-family:var(--mono);font-size:10px;color:var(--blue-dark);background:var(--blue-soft);border:1px solid #C7CCF7;border-radius:5px;padding:1px 6px}
.concept p{font-size:12.5px;color:var(--ink-soft);line-height:1.5}

/* ---- Ayuda ---- */
.ayuda-search{position:relative;margin-bottom:8px}
.ayuda-search input{width:100%;padding:12px 14px 12px 40px;font-size:14px}
.ayuda-search .s-ico{position:absolute;left:13px;top:11px;width:17px;height:17px;color:var(--ink-mute);pointer-events:none}
.faq-cat{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--blue-dark);margin:18px 0 8px}
details.faq{border:1px solid var(--work-line);border-radius:10px;margin-bottom:8px;background:var(--work);overflow:hidden}
details.faq summary{padding:13px 16px;cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:flex-start;gap:11px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:'+';font-family:var(--mono);color:var(--blue);font-size:17px;line-height:1.1;width:13px;flex:none}
details.faq[open] summary::before{content:'–'}
details.faq[open] summary{border-bottom:1px solid var(--work-alt)}
details.faq .faq-a{padding:12px 16px 14px 40px;font-size:13px;color:var(--ink-soft);line-height:1.6}
details.faq .faq-a b{color:var(--ink)}
.glos{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 24px}
.glos .g-item{padding:9px 0;border-bottom:1px solid var(--work-alt)}
.glos .g-term{font-weight:600;font-size:13px}
.glos .g-def{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.45}

@media(max-width:1180px){.concept-grid{grid-template-columns:1fr}.glos{grid-template-columns:1fr}}

/* ---- Impresión limpia del informe (M6) ---- */
@media print{
  #banda-demo{position:static;height:auto;border:0;background:#fff;color:#8A5C00;justify-content:flex-start;padding:0 0 8px}

@media(max-width:1180px){.cards{grid-template-columns:repeat(2,1fr)}.origin .rows{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}}

<script>
/* ===========================================================================
   0 · CONFIGURACIÓN Y FECHA DE REFERENCIA
   Toda la aritmética de prescripción se ancla a HOY para que el reloj sea real.
   =========================================================================== */
const NS='munia_cobranza_v1_';
const HOY=new Date(2026,6,31);           // 31-07-2026 (mes 0-indexado: 6 = julio)
const MS_DIA=86400000;
const COMUNA='Villa Esperanza';

/* Utilidades de fecha */
function addAnios(f,n){const d=new Date(f);d.setFullYear(d.getFullYear()+n);return d;}
function diffDias(a,b){return Math.round((a-b)/MS_DIA);}                 // a - b en días
function fmtFecha(f){const d=String(f.getDate()).padStart(2,'0'),m=String(f.getMonth()+1).padStart(2,'0');return d+'-'+m+'-'+f.getFullYear();}
function fmtCLP(n){return '$'+Math.round(n).toLocaleString('es-CL');}

/* ===========================================================================
   1 · PRNG DETERMINISTA (mulberry32)
   Semilla fija => la demo es idéntica en cada carga (reproducibilidad).
   =========================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260731);
function ri(min,max){return Math.floor(rnd()*(max-min+1))+min;}          // entero en [min,max]
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function chance(p){return rnd()<p;}

/* ===========================================================================
   2 · GENERADOR DE RUT SINTÉTICO CON DÍGITO VERIFICADOR VÁLIDO (módulo 11)
   RUT bien formados aumentan credibilidad; siguen siendo ficticios.
   =========================================================================== */
function dvRut(num){let s=1,m=0;while(num>0){s=(s+num%10*(9-m++%6))%11;num=Math.floor(num/10);}return s?String(s-1):'K';}
function genRut(){const n=ri(6000000,24000000);return n.toLocaleString('es-CL')+'-'+dvRut(n);}

/* ===========================================================================
   3 · DICCIONARIOS PARA DATOS SINTÉTICOS COHERENTES
   =========================================================================== */
const NOMBRES=['Juan','María','Pedro','Carla','Luis','Rosa','José','Ana','Diego','Marta','Felipe','Sofía','Andrés','Paula','Jorge','Elena','Ramón','Ivonne','Sergio','Claudia'];
const APELLIDOS=['González','Muñoz','Rojas','Díaz','Pérez','Soto','Contreras','Silva','Martínez','Sepúlveda','Torres','Fuentes','Araya','Vergara','Castro','Reyes','Gutiérrez','Morales','Vega','Tapia'];
const RAZONES=['Comercial','Inversiones','Distribuidora','Servicios','Constructora','Alimentos','Transportes','Automotriz','Ferretería','Panificadora','Agrícola','Textil'];
const RSUFIJO=['Ltda.','SpA','S.A.','EIRL','y Cía. Ltda.'];
const GIROS=[['Almacén / minimarket','471000'],['Restaurant','561000'],['Ferretería','475200'],['Peluquería','960201'],['Taller mecánico','452001'],['Farmacia','477310'],['Panadería','107100'],['Botillería','477230'],['Consultora','702000'],['Bazar','477890'],['Carnicería','472200'],['Constructora','410010']];
const GIRO_ALCOHOL=['Botillería','Restaurant con patente de alcoholes','Depósito de bebidas alcohólicas','Bar / pub'];
const CALLES=['Av. Los Aromos','Calle Esperanza','Pasaje El Roble','Av. Central','Calle Colón','Los Carrera','Av. Portales','Calle Prat','Camino El Sauce','Av. Manuel Rodríguez'];
const SOC_INVERSION=['Inversiones','Rentas','Capitales','Patrimonial','Inmobiliaria e Inversiones'];

function nombrePersona(){return pick(NOMBRES)+' '+pick(APELLIDOS)+' '+pick(APELLIDOS);}
function razonSocial(){return pick(RAZONES)+' '+pick(APELLIDOS)+' '+pick(RSUFIJO);}
function direccion(){return pick(CALLES)+' '+ri(50,3800);}

/* ===========================================================================
   4 · GENERACIÓN DEL MODELO DE DATOS SINTÉTICO
   Se construyen segmentos con tamaños EXACTOS para que las tarjetas de M1
   muestren números coherentes con la cartera (no hay cifras "de adorno").

   Composición objetivo (según prompt):
     640 roles · brecha SII 74 · riesgo <180d 23 · prescritas 9 ·
     inconsistencia capital 38 · sociedades inversión sin patente 11 ·
     alcoholes con deuda 6 · impagas recuperables 145 · al día ~380.
   =========================================================================== */
function generarDatos(){
  const roles=[], cuotas=[], registrosSII=[];
  let idCuota=1, nrol=3000;

  /* Fabrica un contribuyente (denormalizado en el rol para render simple) */
  function nuevoContribuyente(tipoForzado){
    const juridica = tipoForzado ? tipoForzado==='juridica' : chance(.45);
    return {
      rut:genRut(),
      razon_social: juridica?razonSocial():nombrePersona(),
      tipo: juridica?'juridica':'natural',
      fallecido:false
    };
  }

  /* Crea un rol + su(s) cuota(s) según parámetros del segmento */
  function nuevoRol(opts){
    opts=opts||{};
    const c=opts.contribuyente||nuevoContribuyente();
    const g=opts.alcohol?[pick(GIRO_ALCOHOL),'110000']:pick(GIROS);
    const capMun=opts.capital||ri(3,220)*1000000;                 // capital propio base municipal
    // Inconsistencia de capital propio municipal vs SII (segmento 38)
    const capSII = opts.inconsistente ? Math.round(capMun*(1+ (chance(.5)?1:-1)*(.35+rnd()*.9))) : capMun;
    const dirComercial=opts.direccion||direccion();               // domicilio comercial (padrón)
    const dirSII = chance(.35)?direccion():dirComercial;          // domicilio registrado ante el SII
    const rol={
      numero_rol:String(nrol++),
      rut_contribuyente:c.rut,
      contribuyente:c,
      tipo_patente: opts.alcohol?'alcoholes':pick(['comercial','comercial','comercial','industrial','profesional']),
      giro:g[0], codigo_actividad_sii:g[1],
      direccion:dirComercial,
      domicilio_sii:dirSII,   // en ~35% difiere del comercial (contraste M5)
      uso_suelo_ok: !opts.ruido_dir,
      estado: opts.estado_rol||'vigente',
      fecha_otorgamiento: addAnios(HOY,-ri(1,14)),
      capital_propio_municipal:capMun,
      capital_propio_sii:capSII,
      inconsistente_capital: !!opts.inconsistente,
      ruido: opts.ruido||null,
      tasa_aplicada:'2,5 x 1.000 (art. 24 DL 3.063)'
    };
    roles.push(rol);
    return rol;
  }

  /* Crea una cuota atómica anclada por su vencimiento (define el reloj) */
  function nuevaCuota(rol,periodo,venc,estado,monto){
    const fPresc = addAnios(venc,3);                              // plazo 3 años (art. 2521 CC)
    const dias = diffDias(fPresc,HOY);                            // días a prescripción
    let est=estado;
    if(est==='impaga' && dias<0) est='prescrita';                // prescrita por omisión
    cuotas.push({
      id:idCuota++, numero_rol:rol.numero_rol, rut:rol.contribuyente.rut,
      contribuyente:rol.contribuyente.razon_social, tipo_patente:rol.tipo_patente,
      periodo, monto, fecha_vencimiento:venc, fecha_prescripcion:fPresc,
      dias_a_prescripcion:dias, estado:est,
      hito_interrupcion:null
    });
  }

  /* Genera un vencimiento aleatorio dentro de un rango [aniosMin,aniosMax] atrás */
  function vencEntre(aMin,aMax){
    const dTotal=ri(Math.round(aMin*365),Math.round(aMax*365));
    return new Date(HOY.getTime()-dTotal*MS_DIA);
  }
  const periodoDe=(f)=> f.getFullYear()+'-S'+(f.getMonth()<6?1:2);

  /* ---- 4.1 · SEGMENTO "AL DÍA" (~380 roles, cuotas pagadas + historial) ---- */
  for(let i=0;i<380;i++){
    const r=nuevoRol({});
    // 1 a 2 cuotas históricas pagadas
    const nq=ri(1,2);
    for(let q=0;q<nq;q++){
      const v=vencEntre(.4+q, 1.4+q);
      nuevaCuota(r,periodoDe(v),v,'pagada',ri(45,900)*1000);
    }
  }

  /* ---- 4.2 · IMPAGAS RECUPERABLES (145 cuotas, verde/ámbar)
       Rango acotado a [.5,2.4] años para que NINGUNA caiga bajo 180 días:
       así el corte rojo <180 lo componen exactamente las 23 del segmento 4.3. ---- */
  for(let i=0;i<145;i++){
    const r=nuevoRol({estado_rol: chance(.85)?'vigente':'provisoria'});
    const v=vencEntre(.5,2.4);                                    // dias a prescripción ≥ ~219
    nuevaCuota(r,periodoDe(v),v,'impaga',ri(60,1200)*1000);
  }

  /* ---- 4.3 · RIESGO <180 DÍAS (exactamente 23, rojo)
       Banda interior 10–165 (lejos de los bordes 0 y 180) para que el redondeo
       por año bisiesto no saque ninguna del rango: así la tarjeta M1 marca 23
       de forma estable ante cualquier corrimiento del PRNG. ---- */
  for(let i=0;i<23;i++){
    const r=nuevoRol({});
    const dObjetivo=ri(10,165);
    const v=new Date(addAnios(HOY,-3).getTime()+dObjetivo*MS_DIA);
    nuevaCuota(r,periodoDe(v),v,'impaga',ri(80,1400)*1000);
  }

  /* ---- 4.4 · PRESCRITAS POR OMISIÓN (exactamente 9, negro) ---- */
  for(let i=0;i<9;i++){
    const r=nuevoRol({estado_rol:'vigente'});
    const dPasado=ri(20,900);                                     // prescribió hace 20..900 días
    const v=new Date(addAnios(HOY,-3).getTime()-dPasado*MS_DIA);
    nuevaCuota(r,periodoDe(v),v,'impaga',ri(90,1600)*1000);       // se marcará 'prescrita'
  }

  /* ---- 4.5 · ALCOHOLES CON DEUDA (exactamente 6) ---- */
  for(let i=0;i<6;i++){
    const r=nuevoRol({alcohol:true});
    const v=vencEntre(.3,2.2);
    nuevaCuota(r,periodoDe(v),v,'impaga',ri(300,2200)*1000);
  }

  /* ---- 4.6 · INCONSISTENCIA CAPITAL PROPIO (exactamente 38 roles) ---- */
  for(let i=0;i<38;i++){
    const r=nuevoRol({inconsistente:true});
    const v=vencEntre(.5,2.0);
    nuevaCuota(r,periodoDe(v),v, chance(.5)?'impaga':'pagada', ri(120,1800)*1000);
    // El registro SII correspondiente (con capital distinto) alimenta el contraste
    registrosSII.push({
      rut:r.contribuyente.rut, capital_propio_declarado:r.capital_propio_sii,
      codigo_actividad:r.codigo_actividad_sii, domicilio_registrado:direccion(),
      periodo:'2026-05', tiene_rol:true, tipo:'inconsistencia'
    });
  }

  /* ---- 4.7 · RUIDO ADMINISTRATIVO (~60 roles: fallecidos, duplicados, etc.) ---- */
  const RUIDOS=['fallecido_con_rol_activo','direccion_inexistente','empresa_sin_termino_giro','rol_duplicado'];
  for(let i=0;i<60;i++){
    const tipoR=pick(RUIDOS);
    const c=nuevoContribuyente(tipoR==='empresa_sin_termino_giro'?'juridica':null);
    if(tipoR==='fallecido_con_rol_activo') c.fallecido=true;
    const r=nuevoRol({contribuyente:c, ruido:tipoR, ruido_dir:tipoR==='direccion_inexistente',
      direccion: tipoR==='direccion_inexistente'?'Calle inexistente s/n':undefined});
    const v=vencEntre(.4,2.4);
    nuevaCuota(r,periodoDe(v),v, chance(.5)?'impaga':'pagada', ri(50,700)*1000);
  }

  /* ---- 4.8 · BRECHA DE PADRÓN: 74 RUT en archivo SII SIN rol de patente ---- */
  for(let i=0;i<74;i++){
    const c=nuevoContribuyente(chance(.4)?'juridica':'natural');
    const g=pick(GIROS);
    registrosSII.push({
      rut:c.rut, razon_social:c.razon_social,
      capital_propio_declarado:ri(4,180)*1000000,
      codigo_actividad:g[1], giro:g[0],
      domicilio_registrado:direccion(),
      fecha_inicio_actividades: fmtFecha(addAnios(HOY,-ri(1,6))),
      periodo:'2026-05', tiene_rol:false, tipo:'brecha'
    });
  }

  /* ---- 4.9 · SOCIEDADES DE INVERSIÓN con domicilio SII en la comuna sin patente
       (11) — POTENCIAL brecha: jurisprudencia CS dividida sobre si la sociedad
       de inversión PASIVA está gravada (CS 2022 no / CS dic-2025 sí). Se rotula
       como "potencial", no como brecha cerrada. [Corrección jurídica ④] ---- */
  for(let i=0;i<11;i++){
    const c={rut:genRut(), razon_social:pick(SOC_INVERSION)+' '+pick(APELLIDOS)+' '+pick(RSUFIJO), tipo:'juridica', fallecido:false};
    registrosSII.push({
      rut:c.rut, razon_social:c.razon_social,
      capital_propio_declarado:ri(50,1200)*1000000,
      codigo_actividad:'642000', giro:'Sociedad de inversión',
      domicilio_registrado:direccion(),
      fecha_inicio_actividades: fmtFecha(addAnios(HOY,-ri(2,9))),
      periodo:'2026-05', tiene_rol:false, tipo:'potencial_inversion'
    });
  }

  return {roles,cuotas,registrosSII};
}

/* ===========================================================================
   5 · ESTADO GLOBAL Y PERSISTENCIA
   - Datos base: deterministas desde semilla (se regeneran en cada carga).
   - Estado mutable (convenios suscritos): localStorage, se fusiona sobre la base.
   =========================================================================== */
const DB=generarDatos();

function cargarConvenios(){try{return JSON.parse(localStorage.getItem(NS+'convenios')||'{}');}catch(e){return {};}}
function guardarConvenios(o){localStorage.setItem(NS+'convenios',JSON.stringify(o));}
let CONVENIOS=cargarConvenios();     // { idCuota: {fecha, fecha_prescripcion_nueva} }

/* Aplica los convenios persistidos sobre las cuotas base (reinicia el reloj) */
function aplicarConvenios(){
  DB.cuotas.forEach(c=>{
    const cv=CONVENIOS[c.id];
    if(cv){
      c.estado='convenida';
      c.hito_interrupcion='reconocimiento';
      c.fecha_prescripcion=new Date(cv.fecha_prescripcion_nueva);
      c.dias_a_prescripcion=diffDias(c.fecha_prescripcion,HOY);
      c.fecha_convenio=new Date(cv.fecha);
    }
  });
}
aplicarConvenios();

/* ===========================================================================
   5.b · ACTOS y AVISOS — TABLAS SEPARADAS (jamás se combinan)
   ACTO = con efecto jurídico (giro, notificación, resolución, convenio...).
   AVISO = sin efecto jurídico (whatsapp, email, sms). Se muestran en dos
   líneas de tiempo paralelas y distintas en la ficha (M5).
   =========================================================================== */
const FUNCIONARIOS=['P. Rojas · Rentas','M. Díaz · Tesorería','J. Soto · Rentas','C. Fuentes · Rentas'];
const PLANTILLAS_AVISO=['Recordatorio de vencimiento','Aviso ciego de patente','Segundo aviso','Invitación a regularizar'];
let ACTO_SEQ=1, AVISO_SEQ=1, FOLIO_SEQ=1000;
DB.actos=[]; DB.avisos=[];
function generarActosAvisos(){
  DB.cuotas.forEach(c=>{
    // Pocas cuotas pagadas conservan historial visible
    if(c.estado==='pagada' && !chance(.12)) return;
    // ACTO: giro de patente (siempre existe) — ~30 días antes del vencimiento
    DB.actos.push({id:ACTO_SEQ++, id_cuota:c.id, numero_rol:c.numero_rol, rut:c.rut,
      tipo:'giro', fecha:new Date(c.fecha_vencimiento.getTime()-30*MS_DIA),
      folio:'G-'+(FOLIO_SEQ++), funcionario:pick(FUNCIONARIOS), firmado:true,
      texto:'Giro de patente período '+c.periodo});
    if(c.estado==='impaga'||c.estado==='prescrita'||c.estado==='convenida'){
      // ACTO: notificación de cobro (efecto jurídico — prueba diligencia)
      if(chance(.7)) DB.actos.push({id:ACTO_SEQ++, id_cuota:c.id, numero_rol:c.numero_rol, rut:c.rut,
        tipo:'notificacion', fecha:new Date(c.fecha_vencimiento.getTime()+ri(20,120)*MS_DIA),
        folio:'N-'+(FOLIO_SEQ++), funcionario:pick(FUNCIONARIOS), firmado:true,
        texto:'Notificación de deuda impaga'});
      // AVISOS (sin efecto jurídico) — canal informal
      const nAv=ri(1,3);
      for(let i=0;i<nAv;i++) DB.avisos.push({id:AVISO_SEQ++, id_cuota:c.id, numero_rol:c.numero_rol, rut:c.rut,
        canal:pick(['whatsapp','email','sms']), plantilla:pick(PLANTILLAS_AVISO),
        fecha_envio:new Date(c.fecha_vencimiento.getTime()+ri(5,200)*MS_DIA),
        estado_entrega:pick(['entregado','entregado','fallido','pendiente']), apertura:chance(.5)});
    }
    // ACTO: convenio (para cuotas ya convenidas por persistencia)
    if(c.estado==='convenida') DB.actos.push({id:ACTO_SEQ++, id_cuota:c.id, numero_rol:c.numero_rol, rut:c.rut,
      tipo:'convenio', fecha:c.fecha_convenio||HOY, folio:'C-'+(FOLIO_SEQ++),
      funcionario:pick(FUNCIONARIOS), firmado:true,
      texto:'Convenio de pago suscrito — reconocimiento de deuda (art. 2518 CC)'});
  });
}
generarActosAvisos();

/* Compuertas de cobranza aplicables a un contribuyente, con su base legal.
   Incorpora correcciones ②(art. 65 ñ), ③(art. 30) y ⑥(art. 31). */
function compuertasDetalle(rol, cuotasRol){
  const conDeuda=cuotasRol.some(c=>c.estado==='impaga'||c.estado==='prescrita');
  const sobreUmbral=cuotasRol.some(c=>c.estado==='impaga' && c.monto>=800000);
  const esAlcohol=rol.tipo_patente==='alcoholes';
  return [
    {c:'Renovación de patente', base:'No se otorga patente definitiva ni provisoria con deuda pendiente.',
      estado: conDeuda?'Activa · retención en renovación (vence marzo)':'Sin deuda · no aplica', on:conDeuda},
    {c:'Transferencia del establecimiento', base:'Art. 30 DL 3.063 — el nuevo dueño debe anotar la transferencia y responde de la patente del semestre en curso.',
      estado:'Disponible', on:true},
    {c:'Administrador o regente', base:'Art. 31 DL 3.063 — responden del pago los administradores o regentes del establecimiento (no todo representante — CS mar-2026).',
      estado:'Disponible', on:true},
    {c:'Certificado de no deuda', base:'Ordenanza municipal.',
      estado:'Requiere configuración', on:false},
    {c:'Patente de alcoholes', base:'Renovación con acuerdo del concejo — Ley 18.695 art. 65 letra ñ).',
      estado: esAlcohol?'Aplica · requiere acuerdo del concejo':'No aplica', on:esAlcohol},
    {c:'Cobro judicial', base:'Certificado del secretario municipal como título ejecutivo.',
      estado: sobreUmbral?'Sobre umbral · disponible':'Bajo umbral', on:sobreUmbral},
    {c:'Clausura', base:'Art. 58 DL 3.063.',
      estado:'Solo propuesta — decide el alcalde', on:false, propuesta:true}
  ];
}

/* ===========================================================================
   6 · MÉTRICAS DERIVADAS (alimentan las tarjetas de M1 — sin cifras de adorno)
   =========================================================================== */
function metricas(){
  const cuotasVivas=DB.cuotas.filter(c=>c.estado==='impaga'||c.estado==='prescrita'||c.estado==='convenida');
  return {
    brecha: DB.registrosSII.filter(r=>r.tipo==='brecha').length,
    potencialInversion: DB.registrosSII.filter(r=>r.tipo==='potencial_inversion').length,
    riesgo: DB.cuotas.filter(c=>c.estado==='impaga' && c.dias_a_prescripcion>=0 && c.dias_a_prescripcion<180).length,
    prescritas: DB.cuotas.filter(c=>c.estado==='prescrita').length,
    inconsistencia: DB.roles.filter(r=>r.inconsistente_capital).length,
    alcoholesDeuda: DB.cuotas.filter(c=>c.tipo_patente==='alcoholes' && (c.estado==='impaga'||c.estado==='prescrita')).length,
    impagas: DB.cuotas.filter(c=>c.estado==='impaga').length,
    roles: DB.roles.length,
    cuotas: DB.cuotas.length
  };
}

/* ===========================================================================
   7 · CLASIFICACIÓN DE SEMÁFORO (uso exclusivo prescripción)
   =========================================================================== */
function semaforo(c){
  // La prescripción solo aplica a cuotas no pagadas: en pagadas el reloj es
  // irrelevante y mostrarlo confunde al funcionario. Se muestra "—".
  if(c.estado==='pagada') return {cls:'na',txt:'—'};
  if(c.estado==='prescrita' || c.dias_a_prescripcion<0) return {cls:'negro',txt:'PRESCRITA'};
  if(c.dias_a_prescripcion<180) return {cls:'rojo',txt:c.dias_a_prescripcion+' días'};
  if(c.dias_a_prescripcion<=365) return {cls:'ambar',txt:c.dias_a_prescripcion+' días'};
  return {cls:'verde',txt:c.dias_a_prescripcion+' días'};
}
/* Compuertas activas por cuota (resumen; detalle legal completo en M5) */
function compuertas(c){
  const g=[];
  if(c.estado==='impaga'||c.estado==='prescrita'){g.push('Renovación');}
  if(c.tipo_patente==='alcoholes'){g.push('Alcoholes·concejo');}
  if(c.monto>=800000 && c.estado==='impaga'){g.push('Cobro judicial');}
  return g;
}

let M3_ORD={col:'dias_a_prescripcion',dir:1};
function vistaM3(){
  const m=metricas();
  return `

      <input type="text" id="f-q" placeholder="rol o nombre" style="width:180px"></div>
    <span class="count-pill" id="m3-count"></span>
  </div>

  <div class="table-wrap">
    <div class="tbl-scroll"><table id="m3-table">
      <thead><tr>
        ${th('numero_rol','Rol')}${th('contribuyente','Contribuyente')}${th('periodo','Período')}
        ${th('monto','Monto','num')}${th('fecha_vencimiento','Vencimiento')}
        ${th('dias_a_prescripcion','Días a prescripción')}${th('estado','Estado')}
        <th>Compuertas</th>
      </tr></thead>
      <tbody id="m3-body"></tbody>
    </table></div>
  </div>
  <p class="note" style="margin-top:10px">Semáforo — verde &gt;365 días · ámbar 180–365 · rojo &lt;180 · negro = prescrita. Uso exclusivo del estado de prescripción.</p>`;
}
function th(col,lbl,cls){
  const active=M3_ORD.col===col;
  const arrow=active?(M3_ORD.dir>0?' ▲':' ▼'):'';
  return `<th class="sortable ${cls||''}" onclick="ordenarM3('${col}')">${lbl}<span class="arrow">${arrow}</span></th>`;
}
function ordenarM3(col){if(M3_ORD.col===col)M3_ORD.dir*=-1;else{M3_ORD.col=col;M3_ORD.dir=1;}render();}
function filasM3(){
  const ft=val('f-tipo'),fe=val('f-estado'),fp=val('f-presc'),fm=+val('f-monto')||0,fq=(val('f-q')||'').toLowerCase();
  let rows=DB.cuotas.filter(c=>{
    if(ft&&c.tipo_patente!==ft)return false;
    if(fe&&c.estado!==fe)return false;
    if(fm&&c.monto<fm)return false;
    if(fp&&semaforo(c).cls!==fp)return false;
    if(fq&&!(c.numero_rol.includes(fq)||c.contribuyente.toLowerCase().includes(fq)))return false;
    return true;
  });
  const col=M3_ORD.col,dir=M3_ORD.dir;
  rows.sort((a,b)=>{let x=a[col],y=b[col];if(x instanceof Date){x=x.getTime();y=y.getTime();}if(typeof x==='string'){return x.localeCompare(y)*dir;}return (x-y)*dir;});
  return rows;
}
function montarM3(){
  ['f-tipo','f-estado','f-presc','f-monto','f-q'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',pintarFilasM3);});
  pintarFilasM3();
}
function pintarFilasM3(){
  const rows=filasM3();
  const body=document.getElementById('m3-body');
  // Render por string (rápido para ~800 filas; sin appends individuales)
  body.innerHTML=rows.map(c=>{
    const s=semaforo(c);
    const g=compuertas(c).map(x=>`<span class="gate">${x}</span>`).join('');
    return `<tr style="cursor:pointer" onclick="irFicha('${c.rut}')" title="Abrir ficha del contribuyente">
      <td class="mono">${c.numero_rol}</td>
      <td>${c.contribuyente}</td>
      <td class="mono">${c.periodo}</td>
      <td class="num">${fmtCLP(c.monto)}</td>
      <td class="mono">${fmtFecha(c.fecha_vencimiento)}</td>
      <td><span class="sem ${s.cls}"><span class="d"></span>${s.txt}</span></td>
      <td><span class="chip ${c.estado}">${c.estado}</span></td>
      <td>${g||'<span class="muted">—</span>'}</td>
    </tr>`;
  }).join('');
  const cnt=document.getElementById('m3-count');if(cnt)cnt.textContent=rows.length+' cuotas';
}

  const c=DB.cuotas.find(x=>x.id===M4_SEL);if(!c){cont.innerHTML='<p class="muted">Sin cuotas impagas.</p>';return;}

  const bloqueo = c.dias_a_prescripcion>=0 && c.dias_a_prescripcion<90;
  // Línea de tiempo: vencimiento → hoy → prescripción
  const t0=c.fecha_vencimiento.getTime(), t1=c.fecha_prescripcion.getTime(), th_=HOY.getTime();
  const pct=x=>Math.max(0,Math.min(100,(x-t0)/(t1-t0)*100));
  const pHoy=Math.max(0,Math.min(100,pct(th_)));
  const colHoy = s.cls==='negro'?'var(--black-chip)':s.cls==='rojo'?'var(--red)':s.cls==='ambar'?'var(--amber)':'var(--green)';
  // Cuando "Hoy" queda muy cerca de "Prescribe", se ancla su rótulo a la izquierda
  // del nodo y se omite su fecha para evitar colisión con el extremo derecho.
  // El rótulo "Hoy" se eleva a una fila propia (top:-26) para no colisionar
  // con "Vencimiento"/"Prescribe"; su posición horizontal se acota a [8,92]%.
  const pHoyLbl=Math.max(8,Math.min(92,pHoy));
  cont.innerHTML=`

      <div class="tl-track">
        <div class="tl-line"></div>
        <div class="tl-fill" style="width:${pHoy}%;background:${colHoy}"></div>

        <div class="tl-lbl" style="top:-26px;left:${pHoyLbl}%;transform:translateX(-50%);color:${colHoy};font-weight:500">Hoy · ${fmtFecha(HOY)}</div>

        <div class="tl-node" style="left:100%;background:var(--black-chip)"></div>
        <div class="tl-lbl" style="left:100%;transform:translateX(-100%)">Prescribe</div>
        <div class="tl-date" style="left:100%;transform:translateX(-100%)">${fmtFecha(c.fecha_prescripcion)}</div>
      </div>

        <div class="reloj" id="m4-reloj" style="color:${colHoy}">${c.dias_a_prescripcion<0?'PRESCRITA':c.dias_a_prescripcion+' días'}</div>

        <span class="chip ${c.estado}">${c.estado}</span>

         <button class="btn btn-ghost" onclick="revertirConvenio(${c.id})">Revertir convenio (demo)</button>`

        ? `<div class="legal-box" style="margin-bottom:10px"><b>Cuota a menos de 90 días de prescribir.</b> Para cerrarla como incobrable se exige decisión documentada. En su lugar, lo correcto es interrumpir: <span class="cite">art. 2518 CC — reconocimiento (convenio) o demanda notificada.</span></div>
           <button class="btn btn-blue" onclick="suscribirConvenio(${c.id})">Suscribir convenio y reiniciar reloj</button>`
        : `<button class="btn btn-blue" onclick="suscribirConvenio(${c.id})">Suscribir convenio y reiniciar reloj</button>`
    }`;

/* Suscribe convenio: genera reconocimiento, reinicia reloj a 3 años, persiste */
function suscribirConvenio(id){
  const nueva=addAnios(HOY,3);
  CONVENIOS[id]={fecha:HOY.toISOString(),fecha_prescripcion_nueva:nueva.toISOString()};
  guardarConvenios(CONVENIOS);
  const c=DB.cuotas.find(x=>x.id===id);
  c.estado='convenida';c.hito_interrupcion='reconocimiento';c.fecha_prescripcion=nueva;c.dias_a_prescripcion=diffDias(nueva,HOY);c.fecha_convenio=HOY;
  // Genera el ACTO de convenio (efecto jurídico) — se refleja en la ficha M5
  if(!DB.actos.some(a=>a.tipo==='convenio'&&a.id_cuota===id))
    DB.actos.push({id:ACTO_SEQ++,id_cuota:id,numero_rol:c.numero_rol,rut:c.rut,tipo:'convenio',fecha:HOY,folio:'C-'+(FOLIO_SEQ++),funcionario:'Funcionario de turno · demo',firmado:true,texto:'Convenio de pago suscrito — reconocimiento de deuda (art. 2518 CC)'});
  logAudit('Convenio suscrito','Rol '+c.numero_rol+' · '+c.periodo+' · reloj reiniciado');
  render();pintarNav();
  // Efecto visible de reinicio del reloj
  requestAnimationFrame(()=>{const r=document.getElementById('m4-reloj');if(r){r.classList.add('pulse');}const b=document.querySelector('#m4-detalle');if(b)b.classList.add('flash');});
}
function revertirConvenio(id){
  delete CONVENIOS[id];guardarConvenios(CONVENIOS);
  // Recalcular la cuota desde su vencimiento base
  const c=DB.cuotas.find(x=>x.id===id);
  const base=addAnios(c.fecha_vencimiento,3);
  c.fecha_prescripcion=base;c.dias_a_prescripcion=diffDias(base,HOY);
  c.estado = c.dias_a_prescripcion<0?'prescrita':'impaga';c.hito_interrupcion=null;delete c.fecha_convenio;
  DB.actos=DB.actos.filter(a=>!(a.tipo==='convenio'&&a.id_cuota===id));   // retira el acto de convenio
  render();pintarNav();
}

let UPLOAD=null;   // {nombre, rows:[{...,match,sug}]}
function normRut(s){return String(s||'').replace(/[^0-9kK]/g,'').toUpperCase();}
function normNom(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
const PADRON_RUTS=new Set(DB.roles.map(r=>normRut(r.rut_contribuyente)));
// Índice de nombres del padrón → primer RUT asociado (para coincidencia difusa)
const PADRON_NAMES=new Map();
DB.roles.forEach(r=>{const k=normNom(r.contribuyente.razon_social);if(!PADRON_NAMES.has(k))PADRON_NAMES.set(k,{name:r.contribuyente.razon_social,rut:r.rut_contribuyente});});
/* ---- Padrón real (opcional) — convierte la demo en piloto ----
   El municipio puede cargar su propio padrón (CSV con columna RUT). Mientras
   esté cargado, la conciliación corre contra él en vez del padrón sintético.
   Todo se procesa localmente: nada sale del navegador. */
let PADRON_REAL=null;   // {nombre, filas, ruts:Set, names:Map}
function padronActivo(){
  return PADRON_REAL || {nombre:'Padrón de demostración · '+COMUNA,filas:DB.roles.length,ruts:PADRON_RUTS,names:PADRON_NAMES,demo:true};
}
function procesarPadron(nombre,text){
  const rows=parseCSV(text);
  if(!rows.length){abrirModal('Padrón sin datos','<p>No se detectaron filas con RUT. El padrón debe ser un CSV con encabezados y una columna de RUT (idealmente también razón social y n° de rol).</p>');return;}
  const ruts=new Set(),names=new Map();
  rows.forEach(r=>{const nr=normRut(r.rut);if(nr)ruts.add(nr);const k=normNom(r.razon_social);if(k&&!names.has(k))names.set(k,{name:r.razon_social,rut:r.rut});});
  PADRON_REAL={nombre,filas:rows.length,ruts,names};
  logAudit('Padrón municipal cargado',nombre+' · '+ruts.size+' RUT');
  reconciliarDeNuevo();render();
}
function quitarPadron(){

  logAudit('Padrón municipal retirado','vuelve el padrón de demostración');

/* Si el archivo SII ya estaba cargado, se re-concilia contra el padrón activo
   (las resoluciones manuales se descartan: pertenecían al padrón anterior). */
function reconciliarDeNuevo(){
  if(UPLOAD) UPLOAD.rows=reconciliar(UPLOAD.rows.map(({match,sug,resuelta,...r})=>r));
}

/* Conciliación por RUT contra el padrón ACTIVO (real si está cargado, si no el
   sintético); la difusa exige MISMO nombre con RUT distinto (ambigüedad real:
   posible homónimo o cambio de RUT), no mero solape de palabras. */
function reconciliar(rows){
  const P=padronActivo();
  return rows.map(row=>{
    const nr=normRut(row.rut);
    if(nr && P.ruts.has(nr)) return {...row,match:'exacta',sug:null};
    const k=normNom(row.razon_social);
    if(k && P.names.has(k)){const sug=P.names.get(k);if(normRut(sug.rut)!==nr) return {...row,match:'difusa',sug};}
    return {...row,match:'sin',sug:null};   // sin coincidencia = brecha
  });
}
function parseCSV(text){
  // Los CSV exportados desde Excel suelen traer BOM: se elimina
  text=String(text).replace(/^\uFEFF/,'');
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
  if(!lines.length)return [];
  const delim=(lines[0].split(';').length>=lines[0].split(',').length)?';':',';
  const pl=l=>{const o=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===delim){o.push(cur);cur='';}else cur+=ch;}}o.push(cur);return o;};
  const H=pl(lines[0]).map(h=>h.trim().toLowerCase());
  const ix=names=>H.findIndex(h=>names.some(n=>h.includes(n)));
  const iR=ix(['rut']),iN=ix(['razon','razón','nombre']),iG=ix(['giro']),iC=ix(['codigo','código']),iD=ix(['domicilio','direccion','dirección']),iK=ix(['capital']),iI=ix(['inicio']),iP=ix(['periodo','período']);
  return lines.slice(1).map(l=>{const f=pl(l);return{rut:(f[iR]||'').trim(),razon_social:iN>=0?(f[iN]||'').trim():'',giro:iG>=0?f[iG]:'',codigo:iC>=0?f[iC]:'',domicilio:iD>=0?f[iD]:'',capital:iK>=0?f[iK]:'',inicio:iI>=0?f[iI]:'',periodo:iP>=0?f[iP]:''};}).filter(r=>r.rut);
}
function procesarTexto(nombre,text){
  const rows=parseCSV(text);
  if(!rows.length){abrirModal('Archivo sin datos','<p>No se detectaron filas con RUT. Verifique que el CSV incluya una columna de RUT y encabezados.</p>');return;}
  UPLOAD={nombre,rows:reconciliar(rows)};logAudit('Carga y conciliación de archivo',nombre+' · '+rows.length+' filas');render();
}

function montarM2(){
  // Cablea un dropzone + input de archivo a su procesador (SII o padrón)
  const wire=(dropId,inputId,handler)=>{
    const inp=document.getElementById(inputId),drop=document.getElementById(dropId);
    const leer=f=>{if(!f)return;const rd=new FileReader();rd.onload=()=>handler(f.name,rd.result);rd.readAsText(f);};
    if(inp)inp.addEventListener('change',e=>{leer(e.target.files[0]);e.target.value='';});
    if(drop){['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hover');}));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hover');}));
      drop.addEventListener('drop',e=>leer(e.dataTransfer.files[0]));}
  };
  wire('m2-drop','m2-file',procesarTexto);
  wire('m2-drop-padron','m2-file-padron',procesarPadron);
}

  render();
}

      <span class="cite">Este es el acto que interrumpe plazos y prueba diligencia; el WhatsApp del panel anterior, no.</span>

function validarPlantilla(){
  const el=document.getElementById('m7-input'),out=document.getElementById('m7-out'),find=document.getElementById('m7-find');
  if(!el)return;
  const txt=el.value;
  if(!txt.trim()){out.innerHTML='<span class="muted">Escriba un mensaje…</span>';find.innerHTML='';return;}
  let esc=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const hits=[];
  TERMINOS_PROHIBIDOS.forEach(o=>{
    const re=new RegExp('\\b('+o.t+'\\wáéíóúñ*)','gi');
    const re2=new RegExp('('+o.t+'[a-záéíóúñ]*)','gi');
    if(re2.test(txt)){hits.push(o);esc=esc.replace(new RegExp('('+o.t+'[a-záéíóúñ]*)','gi'),'<span class="bad">$1</span>');}
  });
  out.innerHTML=esc;
  find.innerHTML = hits.length
    ? hits.map(o=>`<div class="finding"><span class="term">${o.lbl}</span><span>${o.regla}</span></div>`).join('')
    : '<div class="ok-msg">✓ Sin términos prohibidos. El mensaje puede enviarse como aviso ciego.</div>';
}
function montarM7(){
  const el=document.getElementById('m7-input');if(!el)return;
  el.value='Estimado contribuyente: usted mantiene una deuda morosa. El monto puede derivar en embargo, juicio, cobranza judicial y clausura del local.';
  validarPlantilla();
}

        </select></div>

        <div class="field"><label>Monto (deuda)</label><input type="number" id="m8-monto" value="${c.monto}" min="0"></div>

      </div>
      <div class="plan-out" id="m8-plan"></div>
      <div class="legal-box" style="margin-top:12px">

      </div>
    </div>

    <div class="box">
      <h3>Efecto sobre la prescripción</h3>
      <div class="h-sub">El acto que rescata la cuota.</div>
      <div id="m8-efecto"></div>
      <div class="plan-out" style="margin-top:14px">

        <div class="po"><span class="n" id="m8-cresc">${rescatadas}</span><span class="l">Cuotas rescatadas de prescripción</span></div>
      </div>
      ${convenidasList.length?`<div style="margin-top:12px"><div class="note" style="margin-bottom:4px">Últimos convenios:</div>${convenidasList.slice(0,4).map(x=>`<div class="kv"><span class="kk">Rol ${x.numero_rol} · ${x.periodo}</span><span class="vv">prescribe ${fmtFecha(x.fecha_prescripcion)}</span></div>`).join('')}</div>`:''}
    </div>
  </div>`:'<div class="soon-panel">No hay cuotas impagas para convenir.</div>'}`;
}
function calcularPlanM8(){
  const c=DB.cuotas.find(x=>x.id===M8_SEL);if(!c)return;
  // Saneo de entradas: sin negativos, abono acotado a [0, monto], cuotas 1–36
  const monto=Math.max(0,+val('m8-monto')||c.monto);
  const n=Math.min(36,Math.max(1,Math.round(+val('m8-n')||1)));
  const abono=Math.min(monto,Math.max(0,+val('m8-abono')||0));
  const saldo=monto-abono, cuota=saldo/n;
  const plan=document.getElementById('m8-plan');
  if(plan)plan.innerHTML=`<div class="po"><span class="n">${fmtCLP(abono)}</span><span class="l">Primer abono</span></div>
    <div class="po"><span class="n">${n}</span><span class="l">Cuotas</span></div>
    <div class="po"><span class="n">${fmtCLP(cuota)}</span><span class="l">Valor por cuota</span></div>`;
}
function pintarEfectoM8(){
  const c=DB.cuotas.find(x=>x.id===M8_SEL);const cont=document.getElementById('m8-efecto');if(!cont||!c)return;
  if(c.estado==='convenida'){

      <p class="note" style="margin-top:8px">Al suscribir, el reloj salta a ${fmtFecha(addAnios(HOY,3))}.</p>`;
  }
}
function montarM8(){
  ['m8-monto','m8-n','m8-abono'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',calcularPlanM8);});

/* ===========================================================================
   12 · EXPORTACIÓN CSV (sin librerías)
   =========================================================================== */
/* Descarga un archivo generado (CSV/JSON).
   - Publicado como artifact en claude.ai: el visor bloquea las descargas por
     blob, así que se usa la capacidad "downloads" (el visor pide confirmación).
   - Abierto por doble clic o en un hosting propio (GitHub Pages): método blob. */
let DL_NS;   // namespace de la capacidad, resuelto una sola vez
async function descargar(nombre,contenido,mime){
  try{
    if(window.claude && typeof window.claude.use==='function'){
      if(DL_NS===undefined) DL_NS=await window.claude.use('downloads');
      if(DL_NS){ await DL_NS.save({filename:nombre, data:contenido}); return; }
    }
  }catch(e){ return; /* el visor rechazó o declinó: no hay fallback posible ahí */ }
  const blob=new Blob([contenido],{type:mime||'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function aCSV(headers,filas){
  const esc=v=>{v=v==null?'':String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return headers.join(';')+'\n'+filas.map(f=>f.map(esc).join(';')).join('\n');
}
function exportarCSV(tipo){
  if(tipo==='cartera'){
    const rows=filasM3();
    const csv=aCSV(['rol','contribuyente','periodo','monto','vencimiento','dias_a_prescripcion','estado','fecha_prescripcion'],
      rows.map(c=>[c.numero_rol,c.contribuyente,c.periodo,c.monto,fmtFecha(c.fecha_vencimiento),c.dias_a_prescripcion,c.estado,fmtFecha(c.fecha_prescripcion)]));
    descargar('cartera-por-cuota_villa-esperanza.csv',csv);
  }else if(tipo==='brecha'){
    const rows=DB.registrosSII.filter(r=>r.tipo==='brecha');
    const csv=aCSV(['rut','razon_social','giro','codigo_actividad','domicilio_sii','fecha_inicio_actividades','periodo_archivo'],
      rows.map(r=>[r.rut,r.razon_social,r.giro,r.codigo_actividad,r.domicilio_registrado,r.fecha_inicio_actividades,r.periodo]));
    descargar('brecha-padron-sii_villa-esperanza.csv',csv);
  }
}
